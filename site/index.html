<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Пробежки</title>
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Пробежки">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="bar">
  <div class="bar-row">
    <h1>Пробежки</h1>
    <button class="sync" id="sync" aria-label="Синхронизировать с Garmin">
      <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 0 1-14.3 4.9M4 12a8 8 0 0 1 14.3-4.9"/><path d="M18.5 3v4.2h-4.2M5.5 21v-4.2h4.2"/></svg>
    </button>
  </div>
  <p class="status" id="status" role="status"></p>
  <div class="weekdays" aria-hidden="true"><span>пн</span><span>вт</span><span>ср</span><span>чт</span><span>пт</span><span>сб</span><span>вс</span></div>
</header>

<main class="feed" id="feed" aria-label="Календарь пробежек"></main>

<article class="run-sheet" id="runSheet" role="dialog" aria-labelledby="sheetTitle" hidden>
  <div class="drag-zone" id="dragZone">
    <div class="grabber"></div>
    <div class="sheet-head">
      <h2 id="sheetTitle"></h2>
      <button class="done" id="sheetDone">Готово</button>
    </div>
  </div>
  <div class="sheet-body" id="sheetBody"></div>
</article>

<div class="sheet-wrap" id="tokenWrap" hidden>
  <div class="scrim" data-close-token></div>
  <article class="sheet" role="dialog" aria-modal="true" aria-labelledby="tokenTitle">
    <div class="grabber"></div>
    <div class="sheet-head">
      <h2 id="tokenTitle">Доступ к GitHub</h2>
    </div>
    <p class="note">Чтобы кнопка могла запускать синхронизацию, вставь токен GitHub. Он сохранится только на этом устройстве.</p>
    <form id="tokenForm">
      <input id="tokenInput" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="github_pat_…" aria-label="Токен GitHub" required>
      <div class="row">
        <button type="button" class="ghost" data-close-token>Отмена</button>
        <button type="submit" class="primary">Сохранить и синхронизировать</button>
      </div>
    </form>
  </article>
</div>

<script src="app.js"></script>
</body>
</html>
