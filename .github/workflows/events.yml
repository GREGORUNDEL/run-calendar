name: Edit events

# Started from the page (long press on a day) to add, change or delete a trip.
on:
  workflow_dispatch:
    inputs:
      action:
        description: "add | update | delete"
        required: true
        default: add
      id:
        description: "Event id (update/delete)"
        required: false
        default: ""
      title:
        description: "Title, e.g. Прага"
        required: false
        default: ""
      start:
        description: "First day, YYYY-MM-DD"
        required: false
        default: ""
      end:
        description: "Last day, YYYY-MM-DD"
        required: false
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sync-and-deploy   # shared with the sync workflow, so they never collide
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Update events
        env:
          EVENT_ACTION: ${{ inputs.action }}
          EVENT_ID: ${{ inputs.id }}
          EVENT_TITLE: ${{ inputs.title }}
          EVENT_START: ${{ inputs.start }}
          EVENT_END: ${{ inputs.end }}
        run: python3 scripts/events.py

      - name: Save to the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/events.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update events"
          git pull --rebase -X theirs origin main
          git push origin HEAD:main

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy site
        id: deploy
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait before retry
        if: steps.deploy.outcome == 'failure'
        run: sleep 20

      - name: Deploy site (retry)
        id: deploy_retry
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
