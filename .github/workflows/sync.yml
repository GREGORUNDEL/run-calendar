name: Sync and deploy

on:
  # Sync button on the page (and "Run workflow" on GitHub)
  workflow_dispatch:
    inputs:
      full:
        description: "Перезагрузить всю историю пробежек"
        type: boolean
        default: false
  # Code changes: just redeploy the site
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sync-and-deploy
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        if: github.event_name == 'workflow_dispatch'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Pull runs from Garmin
        if: github.event_name == 'workflow_dispatch'
        env:
          GARMIN_API_KEY: ${{ secrets.GARMIN_API_KEY }}
          FULL_SYNC: ${{ inputs.full }}
        run: |
          pip install --quiet -r scripts/requirements.txt
          python scripts/sync.py

      - name: Save runs to the repository
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Sync runs from Garmin"
          git pull --rebase origin main
          git push origin HEAD:main

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy site
        id: deploy
        continue-on-error: true
        uses: actions/deploy-pages@v4

      # GitHub sometimes can't find the just-uploaded artifact for a few seconds; try again.
      - name: Wait before retry
        if: steps.deploy.outcome == 'failure'
        run: sleep 20

      - name: Deploy site (retry)
        id: deploy_retry
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
