name: Probe Garmin data

# Manual, diagnostic only: prints which fields Garmin returns (names and types, no values).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Probe
        env:
          GARMIN_API_KEY: ${{ secrets.GARMIN_API_KEY }}
        run: python3 scripts/probe.py
